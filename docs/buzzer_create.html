<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Room | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/buzzer_rooms.css?v=20260204c">
</head>
<body class="nav-collapsed">
  <header class="topbar">
    <a href="buzzer_rooms.html" class="back-link" aria-label="Back to Buzzer Rooms">←</a>
    <div class="topbar-title">Create Room</div>
  </header>

  <main class="main">
    <section class="hero">
      <h1>Create Room</h1>
      <p>Set up moderation tools and room rules.</p>
    </section>

    <section class="panel">
      <label class="label">Room Name</label>
      <input id="roomName" type="text" maxlength="30" placeholder="Team Scrimmage" />

      <label class="label">Number of Teams</label>
      <select id="teamCount">
        <option value="2">2 Teams</option>
        <option value="3">3 Teams</option>
        <option value="4">4 Teams</option>
      </select>

      <div id="teamNames" class="team-names">
        <label class="label">Team Names</label>
        <div id="teamNameFields" class="team-name-fields"></div>
      </div>

      <div class="checkbox-row">
        <input id="nsbRules" type="checkbox" checked />
        <label for="nsbRules">Follow NSB official rules</label>
      </div>

      <div id="advancedSettings" class="advanced hidden">
        <h3>Advanced Timing</h3>
        <label class="label">Tossup Answer Time (seconds)</label>
        <input id="tuTime" type="number" min="1" max="20" value="5" />
        <label class="label">Bonus Answer Time (seconds)</label>
        <input id="bonusTime" type="number" min="5" max="30" value="20" />
      </div>

      <button id="createRoomBtn" class="btn primary">Create Room</button>
      <p id="createError" class="error"></p>
    </section>
  </main>

  <script type="module" src="js/buzzer_create.js"></script>
</body>
</html>
