<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atom Bowl — Question Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/question_bank.css">
</head>
<body>

  <div class="waves" aria-hidden="true">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="wave1" fill="rgba(79,124,255,0.20)" d="M0,224L48,229.3C96,235,192,245,288,229.3C384,213,480,171,576,154.7C672,139,768,149,864,176C960,203,1056,245,1152,250.7C1248,256,1344,224,1392,208L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      <path class="wave2" fill="rgba(57,217,138,0.10)" d="M0,256L60,229.3C120,203,240,149,360,138.7C480,128,600,160,720,170.7C840,181,960,171,1080,186.7C1200,203,1320,245,1380,266.7L1440,288L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path>
    </svg>
  </div>

  <!-- NAV -->
  <div class="nav" id="nav">
    <h2 class="nav-title">⚛ Atom Bowl</h2>
    <a href="index.html"><span class="icon">🏠</span> Home</a>
    <a href="generate.html"><span class="icon">🤖</span> Generate</a>
    <a href="practice_home.html"><span class="icon">⚡</span> Practice</a>
    <a href="question_bank.html" class="active"><span class="icon">📚</span> Question Bank</a>
    <a href="settings.html"><span class="icon">⚙️</span> Settings</a>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="hamburger" id="hamburger">☰</div>

  <div class="main">
    <div class="header">
      <div>
        <h1 class="title">Question Bank</h1>
        <div class="subtitle">Browse everything in our <b>question bank</b>. Hit <a href="practice_home.html" style="text-decoration: underline;">Practice</a> to open it in the engine.</div>
      </div> 

      <div class="controls">
        <input id="search" class="input" placeholder="Search (set, round, category, answer...)" />

        <select id="bankSelect" class="select">
          <option value="ALL">Bank: All</option>
          <option value="data/set_A.json">Bank A (Image Questions)</option>
          <option value="data/set_B.json">Bank B (Text Questions)</option>
        </select>

        <select id="level" class="select">
          <option value="ANY">Level: Any</option>
          <option value="MS">MS</option>
          <option value="HS">HS</option>
        </select>

        <select id="category" class="select">
          <option value="ANY">Category: Any</option>
          <option value="EARTH SCIENCE">EARTH SCIENCE</option>
          <option value="MATH">MATH</option>
          <option value="MATHEMATICS">MATHEMATICS</option>
          <option value="ASTRONOMY">ASTRONOMY</option>
          <option value="EARTH AND SPACE">EARTH AND SPACE</option>
          <option value="EARTH AND SPACE SCIENCE">EARTH AND SPACE SCIENCE</option>
          <option value="BIOLOGY">BIOLOGY</option>
          <option value="LIFE SCIENCE">LIFE SCIENCE</option>
          <option value="GENERAL SCIENCE">GENERAL SCIENCE</option>
          <option value="CHEMISTRY">CHEMISTRY</option>
          <option value="PHYSICS">PHYSICS</option>
          <option value="PHYSICAL SCIENCE">PHYSICAL SCIENCE</option>
          <option value="ENERGY">ENERGY</option>
        </select>

        <select id="bonus" class="select">
          <option value="ANY">TU/Bonus: Any</option>
          <option value="false">Toss-up</option>
          <option value="true">Bonus</option>
        </select>

        <div class="pill"><small>Showing</small> <span id="count">0</span></div>
      </div>
    </div>

    <div id="grid" class="grid"></div>

    <div class="pager">
      <button class="pbtn" id="prev">← Prev</button>
      <div class="pill"><small>Page</small> <span id="page">1</span>/<span id="pages">1</span></div>
      <button class="pbtn" id="next">Next →</button>
    </div>

    <div id="status" class="status"></div>
    <div id="err" class="error" style="display:none"></div>
  </div>

  <nav class="bottom-nav" aria-label="Primary">
    <a href="index.html"><span class="icon">🏠</span><span>Home</span></a>
    <a href="generate.html"><span class="icon">🤖</span><span>Generate</span></a>
    <a href="practice_home.html"><span class="icon">⚡</span><span>Practice</span></a>
    <a href="question_bank.html" class="active"><span class="icon">📚</span><span>Bank</span></a>
    <a href="settings.html"><span class="icon">⚙️</span><span>Settings</span></a>
  </nav>
  <script src="js/common.js"></script>
  <script src="js/question_bank.js"></script>
</body>
</html>
