<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Room | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/buzzer_rooms.css?v=20260204c">
</head>
<body class="nav-collapsed">
  <header class="topbar">
    <a href="buzzer_rooms.html" class="back-link" aria-label="Back to Buzzer Rooms">←</a>
    <div class="topbar-title" id="roomTitle">Room</div>
  </header>

  <main class="main">
    <section id="roomSection" class="room">
      <div class="room-header">
        <div>
          <h2 id="roomCodeTitle">Room</h2>
          <p class="muted" id="roomStatus">Waiting for host.</p>
          <div class="room-code-row">
            <span class="muted">Room Code</span>
            <span class="room-code" id="roomCodeValue">-----</span>
            <button id="copyRoomBtn" class="btn mini">Copy Invite</button>
            <button id="joinAsPlayerBtn" class="btn mini">Join as Player</button>
          </div>
        </div>
        <div class="scoreboard" id="scoreboardHeader"></div>
      </div>

      <div class="room-body">
        <div class="desk-panel host-only">
          <div class="desk-section">
            <h3>Game Clock</h3>
            <div class="timer-big" id="gameClockDisplay">03:00</div>
            <div class="btn-row">
              <button id="gameStartBtn" class="btn">▶ Start</button>
              <button id="gamePauseBtn" class="btn">⏸ Pause</button>
              <button id="gameResetBtn" class="btn">🔁 Reset</button>
            </div>
          </div>

          <div class="desk-section">
            <h3>Tossup</h3>
            <label class="label">Category</label>
            <select id="tossupCategory">
              <option value="Earth & Space Science">Earth & Space Science</option>
              <option value="Life Science">Life Science</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Math">Math</option>
            </select>
            <div class="timer-small" id="tossupTimerDisplay">00:05</div>
            <div class="btn-row">
              <button id="startTossupBtn" class="btn">🟢 Open Tossup</button>
              <button id="tossupDeadBtn" class="btn">☠️ Dead</button>
            </div>
            <div class="btn-row triple">
              <button id="tossupInterruptBtn" class="btn">⛔ Interrupt</button>
              <button id="tossupCorrectBtn" class="btn">✅ Correct</button>
              <button id="tossupWrongBtn" class="btn">❌ Incorrect</button>
            </div>
          </div>

          <div class="desk-section">
            <h3>Bonus</h3>
            <label class="label">Bonus Team</label>
            <select id="bonusTeamSelect"></select>
            <div class="timer-small" id="bonusTimerDisplay">00:20</div>
            <div class="btn-row triple">
              <button id="startBonusBtn" class="btn">🟣 Open Bonus</button>
              <button id="bonusCorrectBtn" class="btn">✅ Bonus Correct</button>
              <button id="bonusWrongBtn" class="btn">❌ Bonus Incorrect</button>
            </div>
          </div>

          <div class="desk-section">
            <h3>Room</h3>
            <div class="btn-row single">
              <button id="nextTossupBtn" class="btn">➡️ Open Next Tossup</button>
            </div>
            <p id="hostNote" class="muted"></p>
          </div>
        </div>

        <div class="desk-panel">
          <div class="desk-section">
            <div class="status-pill" id="statusPill">LOCKED</div>
            <div class="question-text" id="questionText">Waiting for host.</div>
          </div>
          <div class="desk-section player-only">
            <div class="player-timers">
              <div class="player-timer-main" id="playerPhaseTimer">00:05</div>
              <div class="player-timer-sub" id="playerGameClock">03:00</div>
            </div>
            <button id="buzzBtn" class="btn primary buzz-giant">⚡ BUZZ</button>
            <div class="buzz-row">
              <span id="buzzStatus" class="muted">Waiting...</span>
            </div>
          </div>
          <div class="desk-section player-only">
            <button id="toggleLogBtn" class="btn">🧾 Show Buzz Log</button>
            <div id="playerLogPanel" class="log-panel hidden"></div>
          </div>
          <div class="desk-section host-only">
            <h3>Buzz Log</h3>
            <div id="logPanel" class="log-panel"></div>
          </div>
        </div>

        <div class="desk-panel">
          <div class="desk-section">
            <h3>Scoreboard</h3>
            <div class="scoreboard" id="scoreboardPanel"></div>
            <button id="exportBtn" class="btn host-only">📄 Export CSV</button>
          </div>
          <div class="desk-section host-only">
            <h3>Player Stats</h3>
            <table class="stats-table">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Team</th>
                  <th>Correct</th>
                  <th>Incorrect</th>
                  <th>Interrupt</th>
                  <th>Buzzes</th>
                </tr>
              </thead>
              <tbody id="statsTableBody"></tbody>
            </table>
          </div>
          <div class="desk-section">
            <h3>Players</h3>
            <div id="playerList" class="player-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script type="module" src="js/buzzer_room.js?v=20260204c"></script>
</body>
</html>
