<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Room | Atom Bowl</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/buzzer_rooms.css?v=20260204c">
</head>
<body class="nav-collapsed is-player">
  <header class="topbar">
    <a href="buzzer_rooms.html" class="back-link" aria-label="Back to Buzzer Rooms">←</a>
    <div class="topbar-title" id="roomTitle">Room</div>
  </header>

  <main class="main">
    <section id="roomSection" class="room">
      <div class="room-header">
        <div>
          <h2 id="roomCodeTitle">Room</h2>
          <p class="muted" id="roomStatus">Loading room...</p>
          <div class="room-code-row">
            <span class="muted">Room Code</span>
            <span class="room-code" id="roomCodeValue">-----</span>
          </div>
        </div>
        <div class="scoreboard" id="scoreboardHeader"></div>
      </div>

      <div class="room-body">
        <div class="desk-panel">
          <div class="desk-section">
            <div class="status-pill" id="statusPill">LOCKED</div>
            <div class="question-text" id="questionText">Waiting for host.</div>
          </div>
          <div class="desk-section">
            <div class="player-timers">
              <div class="player-timer-main" id="playerPhaseTimer">00:05</div>
              <div class="player-timer-sub" id="playerGameClock">03:00</div>
            </div>
            <button id="buzzBtn" class="btn primary buzz-giant">BUZZ</button>
            <div class="buzz-row">
              <span id="buzzStatus" class="muted">Waiting...</span>
            </div>
          </div>
          <div class="desk-section">
            <button id="toggleLogBtn" class="btn">Show Buzz Log</button>
            <div id="playerLogPanel" class="log-panel hidden"></div>
          </div>
        </div>

        <div class="desk-panel">
          <div class="desk-section">
            <h3>Scoreboard</h3>
            <div class="scoreboard" id="scoreboardPanel"></div>
          </div>
          <div class="desk-section">
            <h3>Players</h3>
            <div id="playerList" class="player-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script type="module" src="js/buzzer_room_player.js?v=20260204c"></script>
</body>
</html>
